<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>LFG Arcade</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #17171a;
    }
    #unity-container {
      position: absolute;
      inset: 0;
    }
    /* Canvas fills the window. The page itself never scrolls, so the game always
       occupies the whole viewport without the user doing anything. */
    #unity-canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: #17171a;
    }
    #unity-loading-bar {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      display: none;
      text-align: center;
      font-family: system-ui, sans-serif;
      color: #b9b3a7;
    }
    #unity-progress-bar-empty {
      width: 260px;
      height: 6px;
      margin-top: 14px;
      background: #2a2a2e;
      border-radius: 3px;
      overflow: hidden;
    }
    #unity-progress-bar-full {
      width: 0%;
      height: 100%;
      background: #b58b52;
    }
    #unity-fullscreen-button {
      position: absolute;
      right: 14px;
      top: 14px;
      padding: 7px 14px;
      font-family: system-ui, sans-serif;
      font-size: 13px;
      color: #ede7db;
      background: rgba(20, 19, 19, 0.75);
      border: 1px solid rgba(107, 84, 56, 1);
      border-radius: 5px;
      cursor: pointer;
      opacity: 0.35;
      transition: opacity 0.15s;
    }
    #unity-fullscreen-button:hover { opacity: 1; }
    #unity-warning { position: absolute; left: 50%; top: 8px; transform: translate(-50%, 0); }
  </style>
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="unity-loading-bar">
      <div>LFG Arcade</div>
      <div id="unity-progress-bar-empty"><div id="unity-progress-bar-full"></div></div>
    </div>
    <div id="unity-warning"></div>
    <button id="unity-fullscreen-button" title="Fullscreen">Fullscreen</button>
  </div>

  <script>
    var container = document.querySelector("#unity-container");
    var canvas = document.querySelector("#unity-canvas");
    var loadingBar = document.querySelector("#unity-loading-bar");
    var progressBarFull = document.querySelector("#unity-progress-bar-full");
    var fullscreenButton = document.querySelector("#unity-fullscreen-button");
    var warningBanner = document.querySelector("#unity-warning");

    function unityShowBanner(msg, type) {
      var div = document.createElement('div');
      div.innerHTML = msg;
      div.style.cssText = "background:" + (type == 'error' ? '#a33' : '#ffd') +
        ";color:#111;padding:6px 10px;font-family:system-ui,sans-serif;font-size:13px";
      warningBanner.appendChild(div);
      if (type !== 'error') setTimeout(function () { warningBanner.removeChild(div); }, 5000);
    }

    var buildUrl = "Build";
    var config = {
      dataUrl: buildUrl + "/lfg-arcade.data",
      frameworkUrl: buildUrl + "/lfg-arcade.framework.js",
      codeUrl: buildUrl + "/lfg-arcade.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Lightning Forge Games",
      productName: "LFG Arcade",
      productVersion: "0.1.0",
      showBanner: unityShowBanner,
    };

    // Render at the device's real pixel density so the board stays crisp, but cap it so
    // very high density displays do not pay for a huge framebuffer.
    function applySize() {
      var ratio = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.floor(container.clientWidth * ratio);
      canvas.height = Math.floor(container.clientHeight * ratio);
    }
    applySize();
    window.addEventListener("resize", applySize);

    loadingBar.style.display = "block";

    var script = document.createElement("script");
    script.src = buildUrl + "/lfg-arcade.loader.js";
    script.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        progressBarFull.style.width = 100 * progress + "%";
      }).then(function (unityInstance) {
        loadingBar.style.display = "none";
        // Browsers only allow fullscreen from a user gesture, so it has to be a button.
        fullscreenButton.onclick = function () { unityInstance.SetFullscreen(1); };
      }).catch(function (message) {
        alert(message);
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
